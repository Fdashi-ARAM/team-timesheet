<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Team Timesheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%234BA3FF%22/%3E%3Cstop offset=%221%22 stop-color=%22%230A60D8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%224%22 y=%224%22 width=%2256%22 height=%2256%22 rx=%2216%22 fill=%22url(%23g)%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2216%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22/%3E%3Cpath d=%22M32 22v11l7 5%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E" type="image/svg+xml">
<style>
/* Team Timesheet - dark liquid glass. One accent (blue) on neutral greys. Layout: a 1240px column of glass cards. */
:root {
  --bg: #05070f;
  --text: #f5f5f7;
  --text-2: #b8b8be;
  --text-3: #8e8e96;
  --accent: #0a84ff;
  --accent-text: #4ba3ff;
  --accent-soft: rgba(10, 132, 255, 0.16);
  --silver: #aeb4c2;
  --alert: #ff6b6b;
  --alert-soft: rgba(255, 107, 107, 0.14);
  --glass: rgba(20, 24, 38, 0.48);
  --glass-hi: rgba(255, 255, 255, 0.075);
  --rim: rgba(255, 255, 255, 0.14);
  --hair: rgba(255, 255, 255, 0.07);
  --field: rgba(255, 255, 255, 0.06);
  --field-rim: rgba(255, 255, 255, 0.13);
  --radius: 22px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(38% 34% at 10% 6%, rgba(18, 66, 205, 0.55), transparent 70%),
    radial-gradient(34% 30% at 90% 4%, rgba(56, 42, 168, 0.48), transparent 70%),
    radial-gradient(32% 34% at 2% 58%, rgba(10, 78, 150, 0.42), transparent 70%),
    radial-gradient(30% 32% at 98% 62%, rgba(32, 42, 140, 0.42), transparent 70%),
    radial-gradient(42% 34% at 50% 104%, rgba(22, 52, 140, 0.45), transparent 70%),
    var(--bg);
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: 30px; letter-spacing: -0.02em; }
h2 { font-size: 16px; }
p { margin: 0; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 12px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- glass */
.glass {
  position: relative; border-radius: var(--radius);
  background: linear-gradient(180deg, var(--glass-hi), rgba(255, 255, 255, 0.015) 42%, rgba(255, 255, 255, 0)), var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(150%); backdrop-filter: blur(28px) saturate(150%);
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.16);
}
.glass::before { /* lit rim: bright top-left, fading to the bottom-right */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1) 32%, rgba(255, 255, 255, 0.04) 64%, rgba(255, 255, 255, 0.18));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.glass::after { /* specular streak along the top edge */
  content: ""; position: absolute; top: 1px; left: 12%; width: 42%; height: 1px; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent); border-radius: 1px;
}

/* ---------- top bar */
.topbar {
  position: sticky; top: 12px; z-index: 20; margin: 12px auto 0; max-width: 1240px; width: calc(100% - 32px);
  display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 18px; border-radius: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand img { width: 26px; height: 26px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); margin-left: 8px; overflow-x: auto; }
.tabs a { padding: 7px 14px; border-radius: 10px; color: var(--text-2); font-weight: 500; white-space: nowrap; text-decoration: none; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { background: rgba(255, 255, 255, 0.12); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14); }
.topbar .spacer { flex: 1; }
.who { color: var(--text-2); white-space: nowrap; }
@media (max-width: 860px) { .brand span, .who { display: none; } }

/* ---------- page */
.page { max-width: 1240px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; padding: 4px 6px 2px; }
.page-head .sub { color: var(--text-2); margin-top: 4px; }
.weeknav { display: flex; align-items: center; gap: 8px; }
.weeknav .label { color: var(--text-2); margin-right: 6px; font-weight: 500; }
.row { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.row.wide-left { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); }
@media (max-width: 920px) { .row, .row.wide-left { grid-template-columns: minmax(0, 1fr); } }

/* ---------- tiles */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 16px 18px 15px; min-width: 0; display: grid; gap: 4px; border-radius: 20px; }
.tile .k { color: var(--text-2); font-size: 12px; font-weight: 500; }
.tile .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v.sm { font-size: 19px; line-height: 1.55; }
.tile .s { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- cards */
.card { padding: 22px 24px 22px; min-width: 0; display: grid; gap: 16px; align-content: start; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h .note { color: var(--text-3); font-size: 12px; }
.empty { color: var(--text-2); padding: 18px 0 6px; display: grid; gap: 4px; }
.empty b { color: var(--text); font-weight: 600; }

/* ---------- controls */
.btn {
  appearance: none; border: 1px solid var(--field-rim); background: rgba(255, 255, 255, 0.07); color: var(--text);
  font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 12px; cursor: pointer; min-height: 36px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover:not(:disabled) { background: #2a94ff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: rgba(255, 255, 255, 0.07); }
.btn.danger[data-armed] { color: var(--alert); border-color: rgba(255, 107, 107, 0.5); }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
input[type="text"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-rim); border-radius: 12px;
  padding: 8px 12px; min-height: 38px; width: 100%; min-width: 0;
}
input::placeholder { color: var(--text-3); }
select option { background: #151a28; color: var(--text); }
input:focus, select:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
label.field { display: grid; gap: 6px; min-width: 0; }
label.field > span, .field-label { color: var(--text-2); font-size: 12px; font-weight: 500; }
.form { display: grid; gap: 14px; }
.form-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
.form-err { color: var(--alert); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; font: inherit; font-size: 13px; color: var(--text-2); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--field-rim); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { color: #fff; background: var(--accent-soft); border-color: var(--accent); }
.dur { display: flex; align-items: center; gap: 8px; }
.dur input { width: 80px; text-align: right; }
.dur span { color: var(--text-3); }
.check { appearance: none; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.04); cursor: pointer; display: inline-grid; place-content: center; margin: 0; vertical-align: middle; }
.check::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after { opacity: 1; }

/* ---------- tables */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { color: var(--text-3); font-size: 12px; font-weight: 500; text-align: left; padding: 0 10px 10px; white-space: nowrap; }
.tbl td { padding: 10px; border-top: 1px solid var(--hair); vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 0; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl th.num, .tbl td.num { text-align: right; }
.tbl tr.total td { font-weight: 600; border-top: 1px solid rgba(255, 255, 255, 0.18); }
.tbl tr.dim td { color: var(--text-3); }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.clickable:hover td { background: rgba(255, 255, 255, 0.03); }
.tbl tr.selected td { background: rgba(10, 132, 255, 0.08); }
.tbl .strong { font-weight: 600; }
.tbl input[type="text"], .tbl input[type="date"], .tbl input[type="number"] { min-height: 34px; padding: 6px 10px; }
.scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.accent { color: var(--accent-text); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap;
  background: rgba(255, 255, 255, 0.07); color: var(--text-2); }
.pill.action { background: var(--accent-soft); color: var(--accent-text); }
.pill.alert { background: var(--alert-soft); color: var(--alert); }
.pill.sent { background: rgba(255, 255, 255, 0.05); color: var(--text-3); }

/* ---------- bars and charts */
.hbar { display: grid; grid-template-columns: minmax(70px, 140px) minmax(0, 1fr) 56px; gap: 12px; align-items: center; }
.hbar + .hbar { margin-top: 10px; }
.hbar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.hbar .track { height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); display: flex; overflow: hidden; }
.hbar .track span { height: 100%; }
.hbar .val { text-align: right; font-weight: 500; }
.meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; min-width: 60px; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--text-3); font-size: 11px; font-family: var(--font); }
svg.chart .x text { fill: var(--text-2); }
svg.chart line.grid { stroke: rgba(255, 255, 255, 0.07); }
svg.chart line.base { stroke: rgba(255, 255, 255, 0.18); }

/* ---------- time clock */
.clock { display: grid; gap: 14px; }
.digits { font-family: var(--font-display); font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.digits.idle { color: rgba(255, 255, 255, 0.18); }
.live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px;
  animation: pulse 1.6s ease-in-out infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- entries */
.day-group + .day-group { margin-top: 14px; }
.day-h { display: flex; justify-content: space-between; color: var(--text-2); font-size: 12px; font-weight: 600; padding-bottom: 6px; }
.entry { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) 52px auto; gap: 12px; align-items: center;
  padding: 8px 0; border-top: 1px solid var(--hair); }
.entry .note { color: var(--text-2); overflow-wrap: anywhere; }
.entry .src { color: var(--text-3); font-size: 11px; margin-left: 8px; }
.entry.editing { background: rgba(10, 132, 255, 0.07); border-radius: 10px; }
@media (max-width: 560px) { .entry { grid-template-columns: minmax(0, 1fr) auto; } .entry .note { grid-column: 1 / -1; } }

/* ---------- sign-in */
.center { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 24px 16px; }
.signin { width: min(420px, 100%); padding: 32px 30px 28px; display: grid; gap: 18px; }
.signin .brand { font-size: 18px; }
.signin .brand img { width: 34px; height: 34px; }

/* ---------- toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  padding: 10px 18px; border-radius: 14px; background: rgba(30, 36, 54, 0.92); border: 1px solid var(--rim); color: var(--text);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); max-width: calc(100% - 32px); }
.toast.bad { color: var(--alert); }
code, .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.code { display: block; white-space: pre; overflow-x: auto; padding: 14px 16px; border-radius: 14px; background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--hair); color: var(--text-2); }
.copyline { display: flex; gap: 8px; align-items: center; }
.copyline code { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--hair);
  overflow-x: auto; white-space: nowrap; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--text-2); }
ol.steps b { color: var(--text); font-weight: 600; }

/* ---------- shared-folder edition */
.divider { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; font-weight: 500; margin-top: 6px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.signin .form .btn { width: 100%; }
.page > .faint.small { padding: 0 6px; }
.dur input { width: 80px; flex: 0 1 80px; min-width: 56px; }
@media (max-width: 560px) { .tbl td.muted.small { white-space: nowrap; } }
.notice { border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.5; background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--field-rim); color: var(--text-2); }
.notice b { color: var(--text); font-weight: 600; display: block; }
.notice ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.notice .details { margin-top: 8px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
.notice.warn { border-color: rgba(255, 255, 255, 0.22); }
.notice.bad { border-color: rgba(255, 107, 107, 0.45); background: var(--alert-soft); }
.notice.bad b { color: var(--alert); }
.dropzone { border: 1.5px dashed rgba(255, 255, 255, 0.18); border-radius: 14px; padding: 14px; text-align: center; color: var(--text-3); font-size: 13px; }
.dropzone.over { border-color: var(--accent-text); color: var(--text); background: var(--accent-soft); }
/* ---------- analytics */
.pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; flex: none; }
.indent { padding-left: 17px; }
.card-tools { display: flex; align-items: center; gap: 10px; }
.btn.tiny { min-height: 28px; padding: 4px 10px; font-size: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 500;
  padding: 7px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.12); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14); }
.viz { display: grid; gap: 12px; }
.legend.line i { width: 14px; height: 2px; border-radius: 1px; vertical-align: 3px; }
svg.chart rect.hit { fill: transparent; cursor: crosshair; outline: none; }
svg.chart g.col rect.hit { cursor: default; }
svg.chart g.col.on path { filter: brightness(1.22); }
svg.chart text.cap { fill: var(--text-2); font-size: 10.5px; }
svg.chart path.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart circle.end { stroke-width: 2; }
svg.chart text.endlab { fill: var(--text-2); font-size: 11.5px; }
svg.chart line.cross { stroke: rgba(255, 255, 255, 0.28); stroke-width: 1; }
.hbar .name { display: flex; align-items: center; }
.hbar .track span + span { margin-left: 2px; }
.hbar .track span.lite { opacity: 0.38; }
.hbar:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 4px; border-radius: 6px; }
.hbar.on .track span { filter: brightness(1.18); }
.tbl.heat td.cell { color: var(--text); border-left: 2px solid transparent; background-clip: padding-box; }
.tbl.heat th, .tbl.heat td { padding-left: 10px; padding-right: 10px; }
.alert-text { color: var(--alert); }
.tbl td.strong { white-space: nowrap; }
/* ---------- leave and exit passes */
input[type="time"] { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-rim); border-radius: 12px;
  padding: 8px 12px; min-height: 38px; width: 100%; min-width: 0; }
input[type="time"]:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
.pill.leave { background: var(--accent-soft); color: var(--accent-text); }
.pill.sick { background: rgba(217, 89, 38, 0.18); color: #f2a27f; }
.pill.exit { background: rgba(255, 255, 255, 0.09); color: var(--text); }
.attgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.att { border-radius: 12px; padding: 10px 10px 11px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hair); display: grid; gap: 6px; min-width: 0; align-content: start; }
.att .d { color: var(--text-2); font-size: 12px; font-weight: 600; }
.att .s { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; align-items: center; }
.att.weekend { background: transparent; }
.att.today { border-color: rgba(75, 163, 255, 0.55); }
@media (max-width: 720px) { .attgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tbl.outgrid th, .tbl.outgrid td { padding-left: 8px; padding-right: 8px; min-width: 86px; }
.tbl.outgrid th:first-child, .tbl.outgrid td:first-child { padding-left: 0; min-width: 110px; }
.tbl.outgrid td .pill { margin: 2px 4px 2px 0; }
.tbl.outgrid .weekend { color: var(--text-3); background: rgba(255, 255, 255, 0.015); }
.tbl.outgrid th.today { color: var(--accent-text); }
.tbl.compact th, .tbl.compact td { padding-left: 8px; padding-right: 8px; }

  const isShared = (name) => String(name || "").trim().toLowerCase() === "research";
  const ACCENT = "#0a84ff", SILVER = "#aeb4c2";

  // ------------------------------------------------------------------ folders (File System Access API)

  function attendanceCard(d, wk) {
    const t = iso(today());
    const cells = DOW.map((name, i) => {
      const day = addDays(wk, i), key = iso(day), abs = absencesOn(d, key);
      const weekend = !isWorkday(day);
      const status = abs.length ? abs.map((a) => leavePill(a)) : weekend ? el("span", { class: "faint small" }, "Weekend")
        : key <= t ? el("span", { class: "muted small" }, "In office") : el("span", { class: "faint small" }, "–");
      return el("div", { class: "att" + (weekend ? " weekend" : "") + (key === t ? " today" : "") }, el("div", { class: "d" }, `${name} ${day.getDate()}`), el("div", { class: "s" }, status));
    });
    const s = leaveStats(d.absences, iso(wk), iso(addDays(wk, 6)));
    const bits = [s.annual ? `${fmtDays(s.annual)} annual leave` : null, s.sick ? `${fmtDays(s.sick)} sick` : null, s.exits ? `${s.exits} exit ${s.exits === 1 ? "pass" : "passes"}` : null].filter(Boolean);
    return card("Office attendance", bits.length ? bits.join(" · ") : "No leave or exit passes this week",
      el("div", { class: "attgrid" }, cells),
      el("p", { class: "small" }, el("a", { href: "#/leave" }, "Add leave, a sick day or an exit pass")));
  }

  /* Team page: who was or will be out of the office this week, and what's coming up. */
  function whosOutCard(people, pc, wk) {
    const t = iso(today()), in30 = iso(addDays(today(), 30));
    const rows = people.map(({ data: d }) => ({ name: d.person, color: pc.get(d.person) || OTHER_COLOR, d })).sort((a, b) => a.name.localeCompare(b.name));
    const outToday = rows.map((r) => ({ r, abs: absencesOn(r.d, t) })).filter((x) => x.abs.length);
    const upcoming = rows.flatMap((r) => (r.d.absences || []).filter((a) => a.type !== "exit" && a.from > iso(addDays(wk, 6)) && a.from <= in30).map((a) => ({ r, a })))
      .sort((x, y) => x.a.from.localeCompare(y.a.from));
    const note = outToday.length ? "Out of the office today: " + outToday.map((x) => `${x.r.name} (${x.abs.map(leaveLabel).join(", ").toLowerCase()})`).join(", ") : "Everyone is in today";
    return card("Who's out", note,
      el("div", { class: "scroll" }, el("table", { class: "tbl outgrid" },
        el("thead", {}, el("tr", {}, el("th", {}, "Person"), DOW.map((n, i) => { const day = addDays(wk, i); return el("th", { class: (isWorkday(day) ? "" : "weekend") + (iso(day) === t ? " today" : "") }, `${n} ${day.getDate()}`); }))),
        el("tbody", {}, rows.map((r) => el("tr", {}, el("td", { class: "strong" }, dot(r.color), r.name),
          DOW.map((_, i) => { const day = addDays(wk, i), abs = absencesOn(r.d, iso(day)); return el("td", { class: (isWorkday(day) ? "" : "weekend") + (iso(day) === t ? " today" : "") }, abs.map((a) => leavePill(a))); })))))),
      upcoming.length ? el("div", { class: "form" }, el("span", { class: "field-label" }, "Coming up in the next 30 days"),
        el("div", { class: "scroll" }, el("table", { class: "tbl compact" }, el("tbody", {}, upcoming.map(({ r, a }) =>
          el("tr", {}, el("td", { class: "strong" }, dot(r.color), r.name), el("td", {}, leavePill(a)), el("td", {}, leaveWhen(a)), el("td", { class: "num muted" }, fmtDays(workingDays(a))))))))) : null);
  }

  /* Analytics: leave and passes per person in the chosen period (up to today). */
  function leaveTable(rows, range) {
    const s = rows.map((r) => ({ ...r, l: leaveStats(r.d.absences, range.from, range.end) }));
    const sum = (k) => s.reduce((a, r) => a + r.l[k], 0);
    return card("Leave & exit passes", `${range.label}, up to today · working days`, el("div", { class: "scroll" }, el("table", { class: "tbl" },
      el("thead", {}, el("tr", {}, el("th", {}, rows.length > 1 ? "Person" : ""), el("th", { class: "num" }, "Annual leave"), el("th", { class: "num" }, "Sick days"), el("th", { class: "num" }, "Exit passes"), el("th", { class: "num" }, "Time away on passes"))),
      el("tbody", {}, s.map((r) => el("tr", {}, el("td", { class: "strong" }, r.color ? dot(r.color) : null, r.name), el("td", { class: "num" }, fmtDays(r.l.annual)), el("td", { class: "num" }, fmtDays(r.l.sick)),
        el("td", { class: "num" }, String(r.l.exits)), el("td", { class: "num muted" }, r.l.hoursAway ? hm(r.l.hoursAway * 60) : "–"))),
        rows.length > 1 ? el("tr", { class: "total" }, el("td", {}, "Team"), el("td", { class: "num" }, fmtDays(sum("annual"))), el("td", { class: "num" }, fmtDays(sum("sick"))),
          el("td", { class: "num" }, String(sum("exits"))), el("td", { class: "num" }, sum("hoursAway") ? hm(sum("hoursAway") * 60) : "–")) : null))));
  }

  // ------------------------------------------------------------------ Excel
  function download(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
    const a = el("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function viewExcel(page) {
    const pathIn = el("input", { type: "text", value: state.excelPath, id: "excel-path", "aria-label": "Path of the Timesheets folder" });
    const code = el("pre", { class: "code" });
    const which = el("select", { id: "excel-which", "aria-label": "Which data" }, el("option", { value: "entries" }, "Time entries"), el("option", { value: "calls" }, "Earnings calls"), el("option", { value: "leave" }, "Leave & exit passes"));
    which.value = state.excelWhich || "entries";
    const TYPES = {
      entries: `{{"Date", type date}, {"Hours", type number}, {"Minutes", Int64.Type}, {"Week start", type date},
        {"ISO year", Int64.Type}, {"ISO week", Int64.Type}, {"Month", type date}, {"Year", Int64.Type}, {"Shared category", type logical}}`,
      calls: `{{"Earnings call date", type date}, {"Joined call", type logical}, {"Note written", type logical}, {"Note sent", type date}}`,
      leave: `{{"From", type date}, {"To", type date}, {"Working days", type number}, {"Half day", type logical}, {"Hours away", type number}, {"Year", Int64.Type}, {"Month", type date}}`,
    };
    const BLANKS = { entries: `{"Note"}`, calls: `{"Earnings call date", "Note sent"}`, leave: `{"Working days", "Half day", "Exit pass", "Time", "Hours away", "Note"}` };
    const mcode = () => `let
    Source = Folder.Files("${pathIn.value.trim().replace(/"/g, '""')}"),
    Files = Table.SelectRows(Source, each [Name] = "${which.value}.csv"),
    Tables = Table.AddColumn(Files, "Data", each Table.PromoteHeaders(Csv.Document([Content], [Delimiter = ",", Encoding = 65001, QuoteStyle = QuoteStyle.Csv]), [PromoteAllScalars = true])),
    Combined = Table.Combine(Tables[Data]),
    Blanks = Table.ReplaceValue(Combined, "", null, Replacer.ReplaceValue, ${BLANKS[which.value]}),
    Typed = Table.TransformColumnTypes(Blanks, ${TYPES[which.value]}, "en-US")
in
    Typed`;
    const updateCode = () => { state.excelPath = pathIn.value; state.excelWhich = which.value; code.textContent = mcode(); };
    pathIn.addEventListener("input", updateCode); which.addEventListener("change", updateCode); updateCode();
    const copy = el("button", { type: "button", class: "btn", on: { click: async () => {
      try { await navigator.clipboard.writeText(code.textContent); toast("Copied"); }
      catch { const r = document.createRange(); r.selectNodeContents(code); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Press Ctrl+C to copy"); } } } }, icon("copy"), "Copy query");
    const dl = [], dlTeam = [];
    if (state.data) dl.push(el("button", { type: "button", class: "btn", on: { click: () => download(`time-entries-${state.data.person}.csv`, entriesCsv([state.data])) } }, icon("download"), "My time entries (CSV)"),
      el("button", { type: "button", class: "btn", on: { click: () => download(`earnings-calls-${state.data.person}.csv`, callsCsv([state.data])) } }, icon("download"), "My earnings calls (CSV)"),
      el("button", { type: "button", class: "btn", on: { click: () => download(`leave-${state.data.person}.csv`, absencesCsv([state.data])) } }, icon("download"), "My leave & passes (CSV)"));
    if (state.people) dlTeam.push(el("button", { type: "button", class: "btn primary", on: { click: () => download("time-entries-team.csv", entriesCsv(state.people.map((p) => p.data))) } }, icon("download"), "Team time entries (CSV)"),
      el("button", { type: "button", class: "btn", on: { click: () => download("earnings-calls-team.csv", callsCsv(state.people.map((p) => p.data))) } }, icon("download"), "Team earnings calls (CSV)"),
      el("button", { type: "button", class: "btn", on: { click: () => download("leave-team.csv", absencesCsv(state.people.map((p) => p.data))) } }, icon("download"), "Team leave & passes (CSV)"));
    render(page, pageHead("Excel", "Every save also writes entries.csv, calls.csv and leave.csv into the person's folder, so Excel can read them directly."),
      el("div", { class: "row" },
        card("Your own data", null, el("ol", { class: "steps" },
          el("li", {}, "In Excel: ", el("b", {}, "Data > Get Data > From File > From Text/CSV"), "."),
          el("li", {}, "Pick ", el("b", {}, "entries.csv"), " (or ", el("b", {}, "calls.csv"), ", or ", el("b", {}, "leave.csv"), ") in your folder, then click ", el("b", {}, "Load"), "."),
          el("li", {}, el("b", {}, "Data > Refresh All"), " picks up your latest saves.")),
          dl.length ? el("div", { class: "actions" }, dl) : null),
        card("Everyone (team lead)", "One table for the whole team", el("ol", { class: "steps" },
          el("li", {}, "In Excel: ", el("b", {}, "Data > Get Data > From File > From Folder"), " and pick the Timesheets folder."),
          el("li", {}, "Click ", el("b", {}, "Transform Data"), ", filter the Name column to ", el("b", {}, "entries.csv"), ", then click the double-arrow on the Content column to combine."),
          el("li", {}, "Click ", el("b", {}, "Close & Load"), ". ", el("b", {}, "Data > Refresh All"), " updates it with everyone's latest saves."),
          el("li", {}, "Do the same with ", el("b", {}, "calls.csv"), " for earnings calls and ", el("b", {}, "leave.csv"), " for leave and exit passes.")),
          dlTeam.length ? el("div", { class: "actions" }, dlTeam) : null)),
      card("Or paste this query", "Data > Get Data > From Other Sources > Blank Query > Advanced Editor",
        el("div", { class: "form-row", style: "grid-template-columns:minmax(0,3fr) minmax(150px,1fr)" },
          field("Your Timesheets folder (as shown in File Explorer's address bar)", pathIn), field("Data", which)),
        code, el("div", { class: "actions" }, copy)));
  }

  // ------------------------------------------------------------------ routing
  const VIEWS = { week: viewWeek, calls: viewCalls, categories: viewCategories, team: viewTeam, analytics: viewAnalytics, leave: viewLeave, excel: viewExcel };
  function route() {
    clearInterval(state.tick);
    window.ondragover = window.ondrop = window.ondragleave = null;
    if (!state.me && !state.team) return viewStart();
    let view = (location.hash.match(/^#\/(\w+)/) || [])[1];
    const mineViews = ["week", "calls", "categories", "leave"];
    if (!VIEWS[view] || (mineViews.includes(view) && !state.me) || (view === "team" && !state.team)) view = state.me ? "week" : "team";
    state.view = view;
    const page = shell(view);
    Promise.resolve(VIEWS[view](page)).catch((e) => render(page, el("div", { class: "empty" }, el("b", {}, "This page didn't load."), el("span", {}, friendly(e)))));
  }
  window.addEventListener("hashchange", () => { state.editing = null; route(); });
  // Hook for automated tests: lets a test harness hand in folders without the browser's folder picker.
  window.__teamTimesheetUseFolders = async (me, teamFolder) => {
    state.me = me || null; state.team = teamFolder || null;
    state.data = null; state.dataOwner = null;
    if (me) { const d = await loadMine(); if (d) keep(d); else await mutate(() => {}); }
    if (teamFolder) await loadTeam();
    route();
  };
  (async () => {
    state.week = mondayOf(today());
    if (supported) [state.saved.me, state.saved.team] = await Promise.all([recall("me"), recall("team")]);
    route();
  })();
})();

</script>
